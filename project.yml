name: GlobalRefreshLite
options:
  bundleIdPrefix: com.iceorange
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  GlobalRefreshLite:
    type: application
    platform: iOS
    sources:
      - path: GlobalRefreshLite
    settings:
      base:
        PRODUCT_NAME: GlobalRefreshLite
        PRODUCT_BUNDLE_IDENTIFIER: com.iceorange.globalrefresh.lite
        INFOPLIST_FILE: GlobalRefreshLite/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme: {}
